name: Deploy dashboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  api-docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --tag churn-api-smoke .
      - name: Start API container
        run: docker run --detach --name churn-api-smoke --publish 8000:8000 churn-api-smoke
      - name: Check API health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > health.json; then
              cat health.json
              grep -q '"model_version"' health.json
              exit 0
            fi
            sleep 2
          done
          docker logs churn-api-smoke
          exit 1
      - name: Stop API container
        if: always()
        run: |
          docker stop churn-api-smoke || true
          docker rm churn-api-smoke || true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Generate dashboard
        run: python 04_create_dashboard.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4